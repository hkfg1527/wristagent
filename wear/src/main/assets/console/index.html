<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="WristAgent">
<title>WristAgent 控制台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <div class="bar-row">
      <span class="status" id="status" data-state="connecting" title="连接状态">
        <span class="status-dot"></span>
      </span>
      <span class="bar-title">WristAgent 控制台</span>
      <span class="save" id="save" role="status" aria-live="polite" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.4 4.5L19 7.2"/></svg>
        <span>已保存</span>
      </span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="searchbox">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8 20 20"/></svg>
      <input id="search" type="search" placeholder="搜索设置项" aria-label="搜索设置项"
             autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button type="button" class="search-clear" id="searchClear" hidden aria-label="清除搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="banners" id="banners"></div>

<main class="grid" id="grid" aria-live="off"></main>

<footer class="foot" id="foot"></footer>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" data-sheet-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-describedby="sheetMsg">
    <p class="sheet-title" id="sheetTitle"></p>
    <p class="sheet-msg" id="sheetMsg"></p>
    <div class="sheet-actions">
      <button type="button" class="btn btn--ghost" id="sheetCancel">取消</button>
      <button type="button" class="btn btn--danger-solid" id="sheetOk">确认</button>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
