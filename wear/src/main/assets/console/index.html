<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#F4F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08080B" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="WristAgent">
<title>WristAgent 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23007AFF'/%3E%3Cpath d='M8 9.5a3.2 3.2 0 0 1 3.2-3.2h1.6A3.2 3.2 0 0 1 16 9.5v5a3.2 3.2 0 0 1-3.2 3.2h-1.6A3.2 3.2 0 0 1 8 14.5z' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" aria-label="设置导航">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="6.4" width="10" height="11.2" rx="3"/><path d="M9.4 6.2 9.9 3.2h4.2l.5 3"/><path d="M9.4 17.8 9.9 20.8h4.2l.5-3"/><path d="M10.6 12h2.8"/></svg>
      </span>
      <span class="brand-text"><b>WristAgent</b><i>控制台</i></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span class="sf-note" id="sidebarNote">正在连接…</span>
      <button type="button" class="link-btn" id="reloadBtn">重新加载状态</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-in">
        <span class="status" id="status" data-state="connecting" title="连接状态" role="img" aria-label="连接状态">
          <span class="status-dot"></span>
        </span>
        <span class="tb-device" id="tbDevice" title="设备名">当前设备</span>
        <span class="badge" id="tbBackend" data-k="none">—</span>
        <span class="tb-meta" id="tbPort">端口 —</span>
        <button type="button" class="tb-meta tb-token" id="tbToken" title="填写控制台访问令牌">令牌 —</button>
        <button type="button" class="icon-btn search-btn" id="searchOpen" aria-label="搜索全部设置项" title="搜索设置（/ 或 Ctrl+K）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M15.9 15.9 20 20"/></svg>
          <span class="kbd" aria-hidden="true">/</span>
        </button>
      </div>
      <div class="tabs" id="tabs" role="tablist" aria-label="设置分区"></div>
    </header>

    <div class="banners" id="banners"></div>
    <main class="content" id="content"></main>
    <footer class="foot" id="foot"></footer>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span class="toast-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.4 4.5L19 7.2"/></svg></span>
  <span id="toastText">已保存</span>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-backdrop" data-search-close></div>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="搜索设置项">
    <div class="search-field">
      <svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M15.9 15.9 20 20"/></svg>
      <input id="searchInput" type="text" placeholder="搜索全部设置项，如「令牌」「温度」" aria-label="搜索设置项"
             autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button type="button" class="kbd kbd--btn" id="searchClose" aria-label="关闭搜索">Esc</button>
    </div>
    <div class="search-results" id="searchResults" role="listbox" aria-label="搜索结果"></div>
  </div>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" data-sheet-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-describedby="sheetMsg">
    <p class="sheet-title" id="sheetTitle"></p>
    <p class="sheet-msg" id="sheetMsg"></p>
    <div class="sheet-field" id="sheetField" hidden>
      <input id="sheetInput" class="input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="访问令牌">
      <button type="button" class="icon-btn" id="sheetEye" aria-label="显示或隐藏内容">
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.6 12S6.1 5.6 12 5.6 21.4 12 21.4 12 17.9 18.4 12 18.4 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="3.1"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l16 16"/><path d="M9.7 5.9A9.6 9.6 0 0 1 12 5.6c5.9 0 9.4 6.4 9.4 6.4a17.7 17.7 0 0 1-2.9 3.6"/><path d="M6.5 7.6A17.6 17.6 0 0 0 2.6 12s3.5 6.4 9.4 6.4c1.2 0 2.3-.2 3.3-.7"/><path d="M9.9 14.1a3 3 0 0 1 4.2-4.2"/></svg>
      </button>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn--ghost" id="sheetCancel">取消</button>
      <button type="button" class="btn btn--primary" id="sheetOk">确认</button>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
